<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ConfoundSearch — Organizational structure → Firm performance</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:oklch(0.965 0.004 250); --panel:oklch(1 0 0); --ink:oklch(0.25 0.02 255); --ink-soft:oklch(0.50 0.018 255); --ink-faint:oklch(0.64 0.015 255);
  --rule:oklch(0.90 0.010 250); --rule-soft:oklch(0.945 0.006 250); --accent:oklch(0.52 0.14 252); --radius:4px; --shadow:0 1px 2px oklch(0.4 0.03 255/.06);
  --brand-font:'IBM Plex Mono',monospace; --label-font:'IBM Plex Mono',monospace; --status-font:'IBM Plex Sans',sans-serif; --status-size:15px;
}
html{-webkit-font-smoothing:antialiased;}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);margin:0;
  padding:30px clamp(20px,4vw,44px) 48px;font-size:14px;line-height:1.5;text-wrap:pretty;}
h1{font-size:1.3em;}
.row{display:flex;gap:14px;align-items:flex-start;}
.col{flex:1;min-width:0;}
.md-card-list,.dag-container,.evidence-box{background:var(--panel);border:1px solid var(--rule);
  border-radius:var(--radius);box-shadow:var(--shadow);box-sizing:border-box;}
.md-card-list{padding:10px;}
.md-card-list-header{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);padding:2px 2px 10px;
  border-bottom:1px solid var(--rule);margin-bottom:10px;}
.dag-container{padding:14px 10px;margin:0;}
.dag-svg{background:transparent !important;max-width:620px;}
.evidence-box{padding:4px 24px 20px;max-height:560px;overflow-y:auto;border-left:6px solid transparent;}

/* the cards: one per confound, each listing its two links with their paper counts */
.md-card{border:1px solid #d1d5db;border-radius:3px;padding:10px 12px;margin-bottom:8px;cursor:pointer;
  transition:border-color .15s ease,background .15s ease;}
.md-card .card-name{font-size:15px;font-weight:600;letter-spacing:-0.006em;line-height:1.35;color:var(--ink);}
.leg-btn{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;text-align:left;font:inherit;
  font-size:12.5px;line-height:1.3;color:#34404f;background:transparent;border:0;border-radius:3px;padding:5px 7px;
  margin-top:6px;cursor:pointer;}
.leg-btn small{font-size:11.5px;opacity:.8;white-space:nowrap;}
.leg-btn:hover{background:rgba(0,0,0,.05);}
.leg-btn.active{color:#fff;font-weight:600;}

/* the evidence panel: the edge, how many papers, then each paper */
.evidence-content{font-size:13.5px;line-height:1.6;color:var(--ink);padding-top:6px;}
.evidence-content a{color:var(--accent);text-decoration:none;}
.evidence-content a:hover{text-decoration:underline;}
.edge-section{margin-bottom:14px;}
.edge-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:12px 0 4px;font-weight:600;}
.chip{background:var(--c,#555);color:#fff;border-radius:14px;padding:3px 12px;font-size:16px;line-height:1.35;}
.edge-arrow{color:var(--c,#555);font-size:26px;line-height:1;}
.var-pill{border:2px solid var(--c,#555);border-radius:14px;padding:2px 12px;font-size:16px;background:#fff;line-height:1.35;}
.count{margin:0 0 10px;color:#444;font-size:13.5px;}
.passage-entry{padding:12px 0 12px;}
.supports{display:inline-block;font-size:11.5px;font-weight:600;color:var(--c,#555);border:1px solid var(--c,#555);
  border-radius:10px;padding:1px 9px;margin-bottom:7px;}
.quote{margin:0 0 8px;font-size:15px;line-height:1.55;font-style:italic;color:var(--ink);}
.title{margin:0;font-size:13px;}
.byline{margin:2px 0 0;font-size:12px;line-height:1.7;color:var(--ink-faint);}
.byline .authors{color:var(--ink-soft);}
.byline .venue{font-style:italic;}
.byline .sep{margin:0 7px;opacity:.55;}
.byline .cites{display:inline-block;border:1px solid var(--rule);border-radius:9px;padding:0 8px;font-size:11px;
  line-height:1.5;color:var(--ink-soft);background:var(--rule-soft);}
.quote mark.hl{background:rgba(250,204,21,.4);background:color-mix(in srgb,var(--c,#e0b400) 26%,transparent);
  color:inherit;border-radius:2px;padding:0 1px;font-style:normal;box-decoration-break:clone;
  -webkit-box-decoration-break:clone;}
.quote mark.hl b{font-weight:600;}
.also{margin-top:6px;border:1px dashed #c4cbd5;border-radius:4px;padding:9px 12px;font-size:13px;color:#566;}
.evidence-content b{font-weight:600;}
.evidence-box,.md-card-list{scrollbar-width:thin;scrollbar-color:var(--rule) transparent;}
.evidence-box::-webkit-scrollbar,.md-card-list::-webkit-scrollbar{width:9px;}
.evidence-box::-webkit-scrollbar-thumb,.md-card-list::-webkit-scrollbar-thumb{background:var(--rule);
  border-radius:9px;border:3px solid var(--panel);}

/* the diagram: with an edge chosen, that edge is strong and everything else fades */
.dag-svg text{user-select:none;-webkit-user-select:none;pointer-events:none;}
.dag-md-circle{cursor:pointer;transition:opacity .15s;}
.dag-svg .edge{cursor:pointer;}
.dag-svg .edge-hit{pointer-events:stroke;}
.dag-svg .edge:hover line[data-md]:not(.sel){stroke:#3a3a3a;opacity:.85;}
.dag-svg .edge:hover line[data-md].sel{filter:brightness(.78);}
.dag-count.pill{display:none;} /* a count shows only on a chosen arrow */
.dag-count{pointer-events:none;}
.dag-ring{opacity:0;}
.dag-svg.has-sel line[data-md]:not(.sel){opacity:.14;}
.dag-svg.has-sel line.sel{opacity:1;stroke-width:6;}
.dag-svg.has-sel .dag-md-circle:not(.sel),.dag-svg.has-sel .dag-md-label:not(.sel){opacity:.3;}
.dag-svg.has-sel .dag-md-circle.sel{fill-opacity:.45;stroke-width:5;}
.dag-svg.has-sel .dag-count.pill.sel{display:inline;}
.dag-ring.sel{opacity:.55;}
.dag-var.sel{stroke-width:5;}

/* nav + status header */
.app-nav{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:0 0 14px;border-bottom:1px solid var(--rule);margin:0 0 18px;}
.app-nav .brand{font-family:var(--brand-font,inherit);font-weight:600;color:var(--ink);
  text-transform:uppercase;letter-spacing:.12em;font-size:12px;}
.app-nav .brand em{font-style:normal;color:var(--accent);}
.status-header{margin:0 0 20px;}
.status-header h1{font-size:var(--status-size,17px);font-weight:400;letter-spacing:0;line-height:1.45;
  margin:0;padding:0;border:none;color:var(--ink-soft);text-transform:none;font-family:var(--status-font,inherit);}
.status-header h1 b{font-weight:600;color:var(--ink);}
</style>

<script>
var EVIDENCE_BLOB = {"__deselect__": "<div class=\"evidence-content\">Click an arrow in the diagram, or a confound on the left, to see the papers behind it.</div>", "__meta__:IT intensity": "<div class=\"evidence-content\" data-color=\"#e66fc3\" style=\"--c:#e66fc3\"><section class=\"edge-section\"><div class=\"edge-head\"><span class=\"chip\">IT intensity</span><span class=\"edge-arrow\">\u2192</span><span class=\"var-pill\">Organizational structure</span></div><p class=\"count\"><b>2 papers</b> suggest that IT intensity affects Organizational structure.</p><div class=\"passage-entry\" style=\"margin-top:6px;\">\n<div class=\"supports\">Supports: IT intensity \u2192 Organizational structure</div>\n<p class=\"quote\">\u201cUsing panel data on senior management positions, we show that changes in the structure of the executive team are tightly linked to changes in firm diversification and IT investments.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.1287/mnsc.2013.1795\" target=\"_blank\">Who Lives in the C-Suite? Organizational Structure and the Division of Labor in Top Management</a></b></p>\n<p class=\"byline\"><span class=\"authors\">Maria Guadalupe, Hongyi Li, Julie Wulf</span><span class=\"sep\">\u00b7</span><span class=\"venue\">Management Science</span><span class=\"sep\">\u00b7</span><span class=\"year\">2014</span></p>\n</div>\n<div class=\"passage-entry\" style=\"border-top:1px solid #e6e9ee;margin-top:6px;padding-top:12px;\">\n<div class=\"supports\">Supports: IT intensity \u2192 Organizational structure</div>\n<p class=\"quote\">\u201cOur findings show that the complexity of plants&#x27; operations and organization, the characteristics of the communication technologies in use, the ownership status of plants and the product mix of their parent companies figure prominently in explaining whether authority is delegated to the plant manager or not.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.1111/j.0022-1821.2004.00216.x\" target=\"_blank\">Delegation of Authority In Business Organizations: An Empirical Test</a></b></p>\n<p class=\"byline\"><span class=\"authors\">Massimo G. Colombo, Marco Delmastro</span><span class=\"sep\">\u00b7</span><span class=\"venue\">The Journal of Industrial Economics</span><span class=\"sep\">\u00b7</span><span class=\"year\">2004</span></p>\n</div></section><section class=\"edge-section\"><div class=\"edge-head\"><span class=\"chip\">IT intensity</span><span class=\"edge-arrow\">\u2192</span><span class=\"var-pill\">Firm performance</span></div><p class=\"count\"><b>2 papers</b> suggest that IT intensity affects Firm performance.</p><div class=\"passage-entry\" style=\"margin-top:6px;\">\n<div class=\"supports\">Supports: IT intensity \u2192 Firm performance</div>\n<p class=\"quote\">\u201cUsing detailed firm-level data, we find evidence of complementarities among all three of these innovations in factor demand and productivity regressions.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.1162/003355302753399526\" target=\"_blank\">Information Technology, Workplace Organization, and the Demand for Skilled Labor: Firm-Level Evidence</a></b></p>\n<p class=\"byline\"><span class=\"authors\">T. F. Bresnahan, E. Brynjolfsson, L. M. Hitt</span><span class=\"sep\">\u00b7</span><span class=\"venue\">The Quarterly Journal of Economics</span><span class=\"sep\">\u00b7</span><span class=\"year\">2002</span></p>\n</div>\n<div class=\"passage-entry\" style=\"border-top:1px solid #e6e9ee;margin-top:6px;padding-top:12px;\">\n<div class=\"supports\">Supports: IT intensity \u2192 Firm performance</div>\n<p class=\"quote\">\u201cUS multinationals obtained higher productivity from IT than non-US multinationals, particularly in the same sectors responsible for the US productivity acceleration.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.1257/aer.102.1.167\" target=\"_blank\">Americans Do IT Better: US Multinationals and the Productivity Miracle</a></b></p>\n<p class=\"byline\"><span class=\"authors\">Nicholas Bloom, Raffaella Sadun, John Van Reenen</span><span class=\"sep\">\u00b7</span><span class=\"venue\">American Economic Review</span><span class=\"sep\">\u00b7</span><span class=\"year\">2012</span></p>\n</div></section></div>", "__leg__:IT intensity:to_iv": "<div class=\"evidence-content\" data-color=\"#e66fc3\" style=\"--c:#e66fc3\"><section class=\"edge-section\"><div class=\"edge-head\"><span class=\"chip\">IT intensity</span><span class=\"edge-arrow\">\u2192</span><span class=\"var-pill\">Organizational structure</span></div><p class=\"count\"><b>2 papers</b> suggest that IT intensity affects Organizational structure.</p><div class=\"passage-entry\" style=\"margin-top:6px;\">\n<div class=\"supports\">Supports: IT intensity \u2192 Organizational structure</div>\n<p class=\"quote\">\u201cUsing panel data on senior management positions, we show that changes in the structure of the executive team are tightly linked to changes in firm diversification and IT investments.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.1287/mnsc.2013.1795\" target=\"_blank\">Who Lives in the C-Suite? Organizational Structure and the Division of Labor in Top Management</a></b></p>\n<p class=\"byline\"><span class=\"authors\">Maria Guadalupe, Hongyi Li, Julie Wulf</span><span class=\"sep\">\u00b7</span><span class=\"venue\">Management Science</span><span class=\"sep\">\u00b7</span><span class=\"year\">2014</span></p>\n</div>\n<div class=\"passage-entry\" style=\"border-top:1px solid #e6e9ee;margin-top:6px;padding-top:12px;\">\n<div class=\"supports\">Supports: IT intensity \u2192 Organizational structure</div>\n<p class=\"quote\">\u201cOur findings show that the complexity of plants&#x27; operations and organization, the characteristics of the communication technologies in use, the ownership status of plants and the product mix of their parent companies figure prominently in explaining whether authority is delegated to the plant manager or not.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.1111/j.0022-1821.2004.00216.x\" target=\"_blank\">Delegation of Authority In Business Organizations: An Empirical Test</a></b></p>\n<p class=\"byline\"><span class=\"authors\">Massimo G. Colombo, Marco Delmastro</span><span class=\"sep\">\u00b7</span><span class=\"venue\">The Journal of Industrial Economics</span><span class=\"sep\">\u00b7</span><span class=\"year\">2004</span></p>\n</div></section><div class=\"also\">\u2192 Also: <b>IT intensity \u2192 Firm performance</b> \u00b7 2 papers <a href=\"#\" onclick=\"dagLegClick('IT intensity','to_dv');return false;\">show</a></div></div>", "__leg__:IT intensity:to_dv": "<div class=\"evidence-content\" data-color=\"#e66fc3\" style=\"--c:#e66fc3\"><section class=\"edge-section\"><div class=\"edge-head\"><span class=\"chip\">IT intensity</span><span class=\"edge-arrow\">\u2192</span><span class=\"var-pill\">Firm performance</span></div><p class=\"count\"><b>2 papers</b> suggest that IT intensity affects Firm performance.</p><div class=\"passage-entry\" style=\"margin-top:6px;\">\n<div class=\"supports\">Supports: IT intensity \u2192 Firm performance</div>\n<p class=\"quote\">\u201cUsing detailed firm-level data, we find evidence of complementarities among all three of these innovations in factor demand and productivity regressions.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.1162/003355302753399526\" target=\"_blank\">Information Technology, Workplace Organization, and the Demand for Skilled Labor: Firm-Level Evidence</a></b></p>\n<p class=\"byline\"><span class=\"authors\">T. F. Bresnahan, E. Brynjolfsson, L. M. Hitt</span><span class=\"sep\">\u00b7</span><span class=\"venue\">The Quarterly Journal of Economics</span><span class=\"sep\">\u00b7</span><span class=\"year\">2002</span></p>\n</div>\n<div class=\"passage-entry\" style=\"border-top:1px solid #e6e9ee;margin-top:6px;padding-top:12px;\">\n<div class=\"supports\">Supports: IT intensity \u2192 Firm performance</div>\n<p class=\"quote\">\u201cUS multinationals obtained higher productivity from IT than non-US multinationals, particularly in the same sectors responsible for the US productivity acceleration.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.1257/aer.102.1.167\" target=\"_blank\">Americans Do IT Better: US Multinationals and the Productivity Miracle</a></b></p>\n<p class=\"byline\"><span class=\"authors\">Nicholas Bloom, Raffaella Sadun, John Van Reenen</span><span class=\"sep\">\u00b7</span><span class=\"venue\">American Economic Review</span><span class=\"sep\">\u00b7</span><span class=\"year\">2012</span></p>\n</div></section><div class=\"also\">\u2192 Also: <b>IT intensity \u2192 Organizational structure</b> \u00b7 2 papers <a href=\"#\" onclick=\"dagLegClick('IT intensity','to_iv');return false;\">show</a></div></div>", "__meta__:CEO Style": "<div class=\"evidence-content\" data-color=\"#a8932c\" style=\"--c:#a8932c\"><section class=\"edge-section\"><div class=\"edge-head\"><span class=\"chip\">CEO Style</span><span class=\"edge-arrow\">\u2192</span><span class=\"var-pill\">Organizational structure</span></div><p class=\"count\"><b>2 papers</b> suggest that CEO Style affects Organizational structure.</p><div class=\"passage-entry\" style=\"margin-top:6px;\">\n<div class=\"supports\">Supports: CEO Style \u2192 Organizational structure</div>\n<p class=\"quote\">\u201cA significant extent of the heterogeneity in investment, financial, and organizational practices of firms can be explained by the presence of manager fixed effects.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.1162/003355303322552775\" target=\"_blank\">Managing with Style: The Effect of Managers on Firm Policies</a></b></p>\n<p class=\"byline\"><span class=\"authors\">M. Bertrand, A. Schoar</span><span class=\"sep\">\u00b7</span><span class=\"venue\">The Quarterly Journal of Economics</span><span class=\"sep\">\u00b7</span><span class=\"year\">2003</span></p>\n</div>\n<div class=\"passage-entry\" style=\"border-top:1px solid #e6e9ee;margin-top:6px;padding-top:12px;\">\n<div class=\"supports\">Supports: CEO Style \u2192 Organizational structure</div>\n<p class=\"quote\">\u201cThe model that seems most consistent with the data emphasizes the ability of key actors to alter structure under three circumstances: when the firm has a product-related or -unrelated strategy (which is consistent with Chandler&#x27;s [1962] theorizing); when the corporate presidents have a background in sales or finance; and when other firms in the industry alter their structures.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.2307/2095547\" target=\"_blank\">The Spread of the Multidivisional Form Among Large Firms, 1919-1979</a></b></p>\n<p class=\"byline\"><span class=\"authors\">Neil Fligstein</span><span class=\"sep\">\u00b7</span><span class=\"venue\">American Sociological Review</span><span class=\"sep\">\u00b7</span><span class=\"year\">1985</span></p>\n</div></section><section class=\"edge-section\"><div class=\"edge-head\"><span class=\"chip\">CEO Style</span><span class=\"edge-arrow\">\u2192</span><span class=\"var-pill\">Firm performance</span></div><p class=\"count\"><b>1 paper</b> suggests that CEO Style affects Firm performance.</p><div class=\"passage-entry\" style=\"margin-top:6px;\">\n<div class=\"supports\">Supports: CEO Style \u2192 Firm performance</div>\n<p class=\"quote\">\u201cMoreover, we show that management style is significantly related to manager fixed effects in performance and that managers with higher performance fixed effects receive higher compensation and are more likely to be found in better governed firms.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.1162/003355303322552775\" target=\"_blank\">Managing with Style: The Effect of Managers on Firm Policies</a></b></p>\n<p class=\"byline\"><span class=\"authors\">M. Bertrand, A. Schoar</span><span class=\"sep\">\u00b7</span><span class=\"venue\">The Quarterly Journal of Economics</span><span class=\"sep\">\u00b7</span><span class=\"year\">2003</span></p>\n</div></section></div>", "__leg__:CEO Style:to_iv": "<div class=\"evidence-content\" data-color=\"#a8932c\" style=\"--c:#a8932c\"><section class=\"edge-section\"><div class=\"edge-head\"><span class=\"chip\">CEO Style</span><span class=\"edge-arrow\">\u2192</span><span class=\"var-pill\">Organizational structure</span></div><p class=\"count\"><b>2 papers</b> suggest that CEO Style affects Organizational structure.</p><div class=\"passage-entry\" style=\"margin-top:6px;\">\n<div class=\"supports\">Supports: CEO Style \u2192 Organizational structure</div>\n<p class=\"quote\">\u201cA significant extent of the heterogeneity in investment, financial, and organizational practices of firms can be explained by the presence of manager fixed effects.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.1162/003355303322552775\" target=\"_blank\">Managing with Style: The Effect of Managers on Firm Policies</a></b></p>\n<p class=\"byline\"><span class=\"authors\">M. Bertrand, A. Schoar</span><span class=\"sep\">\u00b7</span><span class=\"venue\">The Quarterly Journal of Economics</span><span class=\"sep\">\u00b7</span><span class=\"year\">2003</span></p>\n</div>\n<div class=\"passage-entry\" style=\"border-top:1px solid #e6e9ee;margin-top:6px;padding-top:12px;\">\n<div class=\"supports\">Supports: CEO Style \u2192 Organizational structure</div>\n<p class=\"quote\">\u201cThe model that seems most consistent with the data emphasizes the ability of key actors to alter structure under three circumstances: when the firm has a product-related or -unrelated strategy (which is consistent with Chandler&#x27;s [1962] theorizing); when the corporate presidents have a background in sales or finance; and when other firms in the industry alter their structures.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.2307/2095547\" target=\"_blank\">The Spread of the Multidivisional Form Among Large Firms, 1919-1979</a></b></p>\n<p class=\"byline\"><span class=\"authors\">Neil Fligstein</span><span class=\"sep\">\u00b7</span><span class=\"venue\">American Sociological Review</span><span class=\"sep\">\u00b7</span><span class=\"year\">1985</span></p>\n</div></section><div class=\"also\">\u2192 Also: <b>CEO Style \u2192 Firm performance</b> \u00b7 1 paper <a href=\"#\" onclick=\"dagLegClick('CEO Style','to_dv');return false;\">show</a></div></div>", "__leg__:CEO Style:to_dv": "<div class=\"evidence-content\" data-color=\"#a8932c\" style=\"--c:#a8932c\"><section class=\"edge-section\"><div class=\"edge-head\"><span class=\"chip\">CEO Style</span><span class=\"edge-arrow\">\u2192</span><span class=\"var-pill\">Firm performance</span></div><p class=\"count\"><b>1 paper</b> suggests that CEO Style affects Firm performance.</p><div class=\"passage-entry\" style=\"margin-top:6px;\">\n<div class=\"supports\">Supports: CEO Style \u2192 Firm performance</div>\n<p class=\"quote\">\u201cMoreover, we show that management style is significantly related to manager fixed effects in performance and that managers with higher performance fixed effects receive higher compensation and are more likely to be found in better governed firms.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.1162/003355303322552775\" target=\"_blank\">Managing with Style: The Effect of Managers on Firm Policies</a></b></p>\n<p class=\"byline\"><span class=\"authors\">M. Bertrand, A. Schoar</span><span class=\"sep\">\u00b7</span><span class=\"venue\">The Quarterly Journal of Economics</span><span class=\"sep\">\u00b7</span><span class=\"year\">2003</span></p>\n</div></section><div class=\"also\">\u2192 Also: <b>CEO Style \u2192 Organizational structure</b> \u00b7 2 papers <a href=\"#\" onclick=\"dagLegClick('CEO Style','to_iv');return false;\">show</a></div></div>", "__meta__:Market Competition": "<div class=\"evidence-content\" data-color=\"#0e9fb3\" style=\"--c:#0e9fb3\"><section class=\"edge-section\"><div class=\"edge-head\"><span class=\"chip\">Market Competition</span><span class=\"edge-arrow\">\u2192</span><span class=\"var-pill\">Organizational structure</span></div><p class=\"count\"><b>2 papers</b> suggest that Market Competition affects Organizational structure.</p><div class=\"passage-entry\" style=\"margin-top:6px;\">\n<div class=\"supports\">Supports: Market Competition \u2192 Organizational structure</div>\n<p class=\"quote\">\u201cUsing a unique panel dataset on firm hierarchies of large US firms (1986-1999) and a quasi-natural experiment (trade liberalization), we find that competition leads firms to flatten their hierarchies: firms reduce the number of positions between the CEO and division managers, and firms increase the number of positions reporting directly to the CEO.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.1257/app.2.4.105\" target=\"_blank\">The Flattening Firm and Product Market Competition: The Effect of Trade Liberalization on Corporate Hierarchies</a></b></p>\n<p class=\"byline\"><span class=\"authors\">Maria Guadalupe, Julie Wulf</span><span class=\"sep\">\u00b7</span><span class=\"venue\">American Economic Journal: Applied Economics</span><span class=\"sep\">\u00b7</span><span class=\"year\">2010</span></p>\n</div>\n<div class=\"passage-entry\" style=\"border-top:1px solid #e6e9ee;margin-top:6px;padding-top:12px;\">\n<div class=\"supports\">Supports: Market Competition \u2192 Organizational structure</div>\n<p class=\"quote\">\u201cConsistent with other papers, competition is associated with decentralization.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.1093/qje/qje029\" target=\"_blank\">The Organization of Firms Across Countries</a></b></p>\n<p class=\"byline\"><span class=\"authors\">Nicholas Bloom, Raffaella Sadun, John Van Reenen</span><span class=\"sep\">\u00b7</span><span class=\"venue\">The Quarterly Journal of Economics</span><span class=\"sep\">\u00b7</span><span class=\"year\">2012</span></p>\n</div></section><section class=\"edge-section\"><div class=\"edge-head\"><span class=\"chip\">Market Competition</span><span class=\"edge-arrow\">\u2192</span><span class=\"var-pill\">Firm performance</span></div><p class=\"count\"><b>2 papers</b> suggest that Market Competition affects Firm performance.</p><div class=\"passage-entry\" style=\"margin-top:6px;\">\n<div class=\"supports\">Supports: Market Competition \u2192 Firm performance</div>\n<p class=\"quote\">\u201cMost important, I present evidence that competition, as measured by increased numbers of competitors or by lower levels of rents, is associated with a significantly higher rate of total factor productivity growth.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.1086/262040\" target=\"_blank\">Competition and Corporate Performance</a></b></p>\n<p class=\"byline\"><span class=\"authors\">Stephen J. Nickell</span><span class=\"sep\">\u00b7</span><span class=\"venue\">Journal of Political Economy</span><span class=\"sep\">\u00b7</span><span class=\"year\">1996</span></p>\n</div>\n<div class=\"passage-entry\" style=\"border-top:1px solid #e6e9ee;margin-top:6px;padding-top:12px;\">\n<div class=\"supports\">Supports: Market Competition \u2192 Firm performance</div>\n<p class=\"quote\">\u201cUsing plant-level panel data on Chilean manufacturers, I find evidence of within plant productivity improvements that can be attributed to a liberalized trade for the plants in the import-competing sector.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.1111/1467-937X.00205\" target=\"_blank\">Trade Liberalization, Exit, and Productivity Improvements: Evidence from Chilean Plants</a></b></p>\n<p class=\"byline\"><span class=\"authors\">Nina Pavcnik</span><span class=\"sep\">\u00b7</span><span class=\"venue\">The Review of Economic Studies</span><span class=\"sep\">\u00b7</span><span class=\"year\">2002</span></p>\n</div></section></div>", "__leg__:Market Competition:to_iv": "<div class=\"evidence-content\" data-color=\"#0e9fb3\" style=\"--c:#0e9fb3\"><section class=\"edge-section\"><div class=\"edge-head\"><span class=\"chip\">Market Competition</span><span class=\"edge-arrow\">\u2192</span><span class=\"var-pill\">Organizational structure</span></div><p class=\"count\"><b>2 papers</b> suggest that Market Competition affects Organizational structure.</p><div class=\"passage-entry\" style=\"margin-top:6px;\">\n<div class=\"supports\">Supports: Market Competition \u2192 Organizational structure</div>\n<p class=\"quote\">\u201cUsing a unique panel dataset on firm hierarchies of large US firms (1986-1999) and a quasi-natural experiment (trade liberalization), we find that competition leads firms to flatten their hierarchies: firms reduce the number of positions between the CEO and division managers, and firms increase the number of positions reporting directly to the CEO.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.1257/app.2.4.105\" target=\"_blank\">The Flattening Firm and Product Market Competition: The Effect of Trade Liberalization on Corporate Hierarchies</a></b></p>\n<p class=\"byline\"><span class=\"authors\">Maria Guadalupe, Julie Wulf</span><span class=\"sep\">\u00b7</span><span class=\"venue\">American Economic Journal: Applied Economics</span><span class=\"sep\">\u00b7</span><span class=\"year\">2010</span></p>\n</div>\n<div class=\"passage-entry\" style=\"border-top:1px solid #e6e9ee;margin-top:6px;padding-top:12px;\">\n<div class=\"supports\">Supports: Market Competition \u2192 Organizational structure</div>\n<p class=\"quote\">\u201cConsistent with other papers, competition is associated with decentralization.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.1093/qje/qje029\" target=\"_blank\">The Organization of Firms Across Countries</a></b></p>\n<p class=\"byline\"><span class=\"authors\">Nicholas Bloom, Raffaella Sadun, John Van Reenen</span><span class=\"sep\">\u00b7</span><span class=\"venue\">The Quarterly Journal of Economics</span><span class=\"sep\">\u00b7</span><span class=\"year\">2012</span></p>\n</div></section><div class=\"also\">\u2192 Also: <b>Market Competition \u2192 Firm performance</b> \u00b7 2 papers <a href=\"#\" onclick=\"dagLegClick('Market Competition','to_dv');return false;\">show</a></div></div>", "__leg__:Market Competition:to_dv": "<div class=\"evidence-content\" data-color=\"#0e9fb3\" style=\"--c:#0e9fb3\"><section class=\"edge-section\"><div class=\"edge-head\"><span class=\"chip\">Market Competition</span><span class=\"edge-arrow\">\u2192</span><span class=\"var-pill\">Firm performance</span></div><p class=\"count\"><b>2 papers</b> suggest that Market Competition affects Firm performance.</p><div class=\"passage-entry\" style=\"margin-top:6px;\">\n<div class=\"supports\">Supports: Market Competition \u2192 Firm performance</div>\n<p class=\"quote\">\u201cMost important, I present evidence that competition, as measured by increased numbers of competitors or by lower levels of rents, is associated with a significantly higher rate of total factor productivity growth.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.1086/262040\" target=\"_blank\">Competition and Corporate Performance</a></b></p>\n<p class=\"byline\"><span class=\"authors\">Stephen J. Nickell</span><span class=\"sep\">\u00b7</span><span class=\"venue\">Journal of Political Economy</span><span class=\"sep\">\u00b7</span><span class=\"year\">1996</span></p>\n</div>\n<div class=\"passage-entry\" style=\"border-top:1px solid #e6e9ee;margin-top:6px;padding-top:12px;\">\n<div class=\"supports\">Supports: Market Competition \u2192 Firm performance</div>\n<p class=\"quote\">\u201cUsing plant-level panel data on Chilean manufacturers, I find evidence of within plant productivity improvements that can be attributed to a liberalized trade for the plants in the import-competing sector.\u201d</p>\n<p class=\"title\"><b><a href=\"https://doi.org/10.1111/1467-937X.00205\" target=\"_blank\">Trade Liberalization, Exit, and Productivity Improvements: Evidence from Chilean Plants</a></b></p>\n<p class=\"byline\"><span class=\"authors\">Nina Pavcnik</span><span class=\"sep\">\u00b7</span><span class=\"venue\">The Review of Economic Studies</span><span class=\"sep\">\u00b7</span><span class=\"year\">2002</span></p>\n</div></section><div class=\"also\">\u2192 Also: <b>Market Competition \u2192 Organizational structure</b> \u00b7 2 papers <a href=\"#\" onclick=\"dagLegClick('Market Competition','to_iv');return false;\">show</a></div></div>"};

var mdColors = {};
document.querySelectorAll('.md-card').forEach(function(card) {
    mdColors[card.getAttribute('data-md')] = card.getAttribute('data-color');
});
var VARIABLE_OF = {to_iv: 'x', to_dv: 'y'};

function showEvidence(key) {
    var box = document.getElementById('evidence-display');
    box.innerHTML = EVIDENCE_BLOB[key] || EVIDENCE_BLOB['__deselect__'];
    var shown = box.querySelector('[data-color]');
    box.style.borderLeftColor = shown ? shown.getAttribute('data-color') : 'transparent';
    box.scrollTop = 0;
}

function forEachNode(selector, fn) {
    document.querySelectorAll('.dag-svg ' + selector).forEach(fn);
}

function highlight(md, leg) {
    var svg = document.querySelector('.dag-svg');
    forEachNode('.sel', function(el) { el.classList.remove('sel'); });
    forEachNode('line[data-md]', function(el) {
        el.setAttribute('stroke', '#888');
        el.setAttribute('marker-end', 'url(#arrowhead-arc)');
    });
    forEachNode('.dag-var', function(el) { el.setAttribute('stroke', '#333'); });
    forEachNode('.dag-ring', function(el) { el.setAttribute('stroke', '#333'); });
    svg.classList.toggle('has-sel', !!md);
    if (md) {
        var color = mdColors[md];
        var mine = function(el) { return el.getAttribute('data-md') === md; };
        var chosen = function(el) { return mine(el) && (!leg || el.getAttribute('data-leg') === leg); };
        forEachNode('.dag-md-circle', function(el) { if (mine(el)) el.classList.add('sel'); });
        forEachNode('.dag-md-label', function(el) { if (mine(el)) el.classList.add('sel'); });
        forEachNode('line[data-md]', function(el) {
            if (!chosen(el)) return;
            el.classList.add('sel');
            el.setAttribute('stroke', color);
            el.setAttribute('marker-end', 'url(#arrow-md-' + color.replace('#', '') + ')');
        });
        forEachNode('.dag-count', function(el) { if (chosen(el)) el.classList.add('sel'); });
        ['to_iv', 'to_dv'].forEach(function(which) {
            if (leg && leg !== which) return;
            forEachNode('[data-var="' + VARIABLE_OF[which] + '"]', function(el) {
                el.classList.add('sel');
                el.setAttribute('stroke', color);
            });
        });
    }
    document.querySelectorAll('.md-card').forEach(function(card) {
        var active = card.getAttribute('data-md') === md;
        var c = mdColors[card.getAttribute('data-md')];
        card.style.border = '2px solid ' + (active ? c : '#d1d5db');
        card.style.background = active ? c + '18' : 'transparent';
    });
    document.querySelectorAll('.leg-btn').forEach(function(btn) {
        var active = btn.getAttribute('data-md') === md && btn.getAttribute('data-leg') === leg;
        btn.classList.toggle('active', active);
        btn.style.background = active ? mdColors[md] : '';
    });
}

function dagBackgroundClick() { highlight(null, null); showEvidence('__deselect__'); }
function dagMetaClick(md) { highlight(md, null); showEvidence('__meta__:' + md); }
function dagLegClick(md, leg) { highlight(md, leg); showEvidence('__leg__:' + md + ':' + leg); }

document.addEventListener('click', function(ev) {
    var button = ev.target.closest('.leg-btn');
    if (button) { dagLegClick(button.getAttribute('data-md'), button.getAttribute('data-leg')); return; }
    var card = ev.target.closest('.md-card');
    if (card) dagMetaClick(card.getAttribute('data-md'));
});
highlight(null, null);
</script>
</body></html>
